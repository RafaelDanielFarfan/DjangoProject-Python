{% extends "base.html" %}

{% block titulo %} Books List {% endblock %}

{% block contenido %} 

<div class="card">

    <div class="card-header">
        <a name="" id="" href="{% url 'crear' %}" class="btn btn-success" role="button">Agregar nuevo Libro</a>
    </div>
    <div class="card-body">
        <h4 class="card-title">Libros</h4>
        <div class="table-responsive-xxl">
            <table class="table table-primary">
                <thead>
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Titulo</th>
                        <th scope="col">Imagen</th>
                        <th scope="col">Descripción</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for libro in libros%}
                    <tr class="">
                        <td>{{ libro.id }}</td>
                        <td>{{libro.titulo}}</td>
                        <td>
                            <img src="{{ libro.imagen.url }}" height="80" width="80">
                        </td>
                        <td>{{libro.descripción}}</td>
                        <td>
                            <a name="" id="" class="btn btn-info" href="{% url 'editar' libro.id %}" role="button">Editar</a>
                            <a name="" id="" class="btn btn-danger" href="{% url 'eliminar' libro.id %}" role="button">Borrar</a>
                        </td>                    
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted">            
        </div>
    </div>
</div>
{% endblock %}
